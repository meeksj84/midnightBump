# Midnight Bump — Hyprlock

source = ~/.config/hypr/midnight-bump-hyprlock-colors.conf

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = $mb_background

    blur_passes = 2
    blur_size = 3
    brightness = 0.92
    vibrancy = 0.20
}

label {
    monitor =
    text = $TIME12
    color = $mb_foreground
    font_size = 52
    font_family = monospace

    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $mb_muted
    font_size = 16
    font_family = monospace

    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    position = 0, -45
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 12

    dots_size = 0.25
    dots_spacing = 0.30
    fade_on_empty = false
    placeholder_text = Password...

    outer_color = $mb_accent
    inner_color = $mb_surface
    font_color = $mb_foreground
    check_color = $mb_accent
    fail_color = $mb_error
}
